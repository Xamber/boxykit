name: CI

# Build, lint, type check and test every pull request and every push to main.
# A green run on main starts the Release workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # First: the docs' lint and type check read files the build generates.
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
