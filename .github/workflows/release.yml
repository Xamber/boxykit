name: Release

# After CI passes on main: publish the version in VERSION, unless npm already has it.
# So bumping VERSION is the release; any other push to main publishes nothing.
#
# Off until the repo variable NPM_PUBLISH is "true" (Settings → Secrets and variables → Actions → Variables).
# npm trusted publishing (npmjs.com → boxykit → Settings → Trusted publisher) names this file, "release.yml":
# no NPM_TOKEN needed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release

jobs:
  release:
    # Only a green CI run of a push to main (not a pull request from a branch called main).
    if: >-
      vars.NPM_PUBLISH == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      # The commit CI checked, not whatever main is now.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "boxykit@$version" version 2>/dev/null)" ]; then
            echo "boxykit $version is already on npm: nothing to release." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 24 may ship an older one.
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run build -w boxykit
      - if: steps.version.outputs.publish == 'true'
        working-directory: packages/boxykit
        run: |
          npm publish
          echo "Published boxykit ${{ steps.version.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
